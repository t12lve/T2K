<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T2K — Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #121214;
      --ink: #f3f3f4;
      --muted: #9a9aa3;
      --line: #2a2a30;
      --twitch: #9146ff;
      --twitch-deep: #772ce8;
      --kick: #53fc18;
      --kick-deep: #3dcc0f;
      --danger: #ff5c7a;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(145, 70, 255, 0.22), transparent 55%),
        radial-gradient(800px 380px at 100% 100%, rgba(83, 252, 24, 0.14), transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    .shell {
      width: min(100% - 2rem, 42rem);
      margin: 0 auto;
      padding: 1.5rem 0 2.5rem;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .brand img {
      width: 72px;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .brand h1 {
      font-family: Syne, sans-serif;
      font-size: 1.55rem;
      margin: 0;
      letter-spacing: -0.03em;
    }
    .brand p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.88rem; }
    .progress {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .progress span {
      height: 4px;
      flex: 1;
      min-width: 1.5rem;
      border-radius: 99px;
      background: var(--line);
    }
    .progress span.on { background: linear-gradient(90deg, var(--twitch), var(--kick)); }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.35rem 1.4rem 1.45rem;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .theme-twitch {
      border-color: rgba(145, 70, 255, 0.45);
      box-shadow: 0 0 0 1px rgba(145, 70, 255, 0.12), 0 20px 50px rgba(0,0,0,.35);
    }
    .theme-kick {
      border-color: rgba(83, 252, 24, 0.4);
      box-shadow: 0 0 0 1px rgba(83, 252, 24, 0.1), 0 20px 50px rgba(0,0,0,.35);
    }
    .theme-bridge {
      border-image: linear-gradient(90deg, var(--twitch), var(--kick)) 1;
      border-width: 1px;
      border-style: solid;
      border-radius: var(--radius);
      border-image-slice: 1;
    }
    /* border-image kills radius — use pseudo instead */
    .theme-bridge {
      border: 1px solid transparent;
      background:
        linear-gradient(var(--panel), var(--panel)) padding-box,
        linear-gradient(90deg, var(--twitch), var(--kick)) border-box;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.28rem 0.55rem;
      border-radius: 99px;
      margin-bottom: 0.75rem;
    }
    .pill-twitch { background: rgba(145,70,255,.18); color: #c4a0ff; }
    .pill-kick { background: rgba(83,252,24,.14); color: var(--kick); }
    .pill-both {
      background: linear-gradient(90deg, rgba(145,70,255,.2), rgba(83,252,24,.14));
      color: var(--ink);
    }
    h2 {
      font-family: Syne, sans-serif;
      font-size: 1.45rem;
      margin: 0 0 0.55rem;
      letter-spacing: -0.02em;
    }
    .lead { color: var(--muted); margin: 0 0 1rem; line-height: 1.55; }
    label { display: block; font-weight: 600; font-size: 0.86rem; margin: 0.85rem 0 0.35rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0c0c0e;
      color: var(--ink);
      font: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--twitch);
      box-shadow: 0 0 0 3px rgba(145,70,255,.2);
    }
    input.kick-focus:focus {
      border-color: var(--kick);
      box-shadow: 0 0 0 3px rgba(83,252,24,.18);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.72rem 1.05rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .btn-twitch { background: var(--twitch); color: #fff; }
    .btn-twitch:hover { background: var(--twitch-deep); }
    .btn-kick { background: var(--kick); color: #0a0a0a; }
    .btn-kick:hover { background: var(--kick-deep); }
    .btn-bridge {
      background: linear-gradient(90deg, var(--twitch), var(--kick));
      color: #0a0a0a;
    }
    .hint { font-size: 0.82rem; color: var(--muted); margin: 0.4rem 0 0; line-height: 1.45; }
    .msg { margin-top: 0.75rem; font-size: 0.9rem; min-height: 1.2em; }
    .ok { color: var(--kick); font-weight: 600; }
    .err { color: var(--danger); font-weight: 600; }
    pre.code {
      margin: 0.75rem 0 0;
      padding: 0.85rem;
      background: #060607;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: auto;
      font: 12px/1.45 ui-monospace, Consolas, monospace;
      color: #d8d8de;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .split {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr;
      margin: 1rem 0;
    }
    @media (max-width: 560px) { .split { grid-template-columns: 1fr; } }
    .tile {
      border-radius: 12px;
      padding: 0.9rem 1rem;
      border: 1px solid var(--line);
    }
    .tile-twitch { background: rgba(145,70,255,.1); border-color: rgba(145,70,255,.35); }
    .tile-kick { background: rgba(83,252,24,.08); border-color: rgba(83,252,24,.3); }
    .tile h3 { margin: 0 0 0.35rem; font-size: 0.95rem; }
    .tile p { margin: 0; color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
    .checklist { list-style: none; padding: 0; margin: 0.75rem 0 0; }
    .checklist li {
      display: flex; gap: 0.55rem; align-items: flex-start;
      padding: 0.45rem 0; border-bottom: 1px solid var(--line); font-size: 0.92rem;
    }
    .checklist li:last-child { border-bottom: 0; }
    .dot {
      width: 0.65rem; height: 0.65rem; border-radius: 50%; margin-top: 0.35rem; flex: none;
    }
    .hidden { display: none !important; }
    .linkish { color: var(--twitch); }
    a { color: var(--kick); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <img src="/logo.png" alt="T2K" width="72" height="40" />
        <div>
          <h1>T2K</h1>
          <p>Twitch <span style="color:var(--twitch)">→</span> Kick</p>
        </div>
      </div>
      <button type="button" class="btn-ghost" id="btnReplay" title="Relancer le guide">Guide</button>
    </header>

    <div class="progress" id="progress" aria-hidden="true"></div>

    <section class="card theme-bridge" id="view"></section>
  </div>

  <script>
    const TOTAL_ONBOARD = 9;
    const state = {
      step: 0,
      mode: 'onboard', // onboard | raid
      cfg: null,
      publicKeyJson: '',
      lastCommand: '',
    };

    const $ = (sel) => document.querySelector(sel);

    function themeForStep(step) {
      if (state.mode === 'raid') return 'theme-kick';
      if ([1, 3, 7].includes(step)) return 'theme-twitch';
      if ([5, 8].includes(step)) return 'theme-kick';
      return 'theme-bridge';
    }

    function pillForStep(step) {
      if (state.mode === 'raid') return { cls: 'pill-kick', text: 'Raid Kick' };
      if ([1, 3, 7].includes(step)) return { cls: 'pill-twitch', text: 'Côté Twitch' };
      if ([5, 8].includes(step)) return { cls: 'pill-kick', text: 'Côté Kick' };
      return { cls: 'pill-both', text: 'Twitch → Kick' };
    }

    function renderProgress() {
      const el = $('#progress');
      if (state.mode !== 'onboard') {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = Array.from({ length: TOTAL_ONBOARD }, (_, i) =>
        `<span class="${i <= state.step ? 'on' : ''}"></span>`
      ).join('');
    }

    async function api(path, opts) {
      let res;
      try {
        res = await fetch(path, {
          headers: { 'Content-Type': 'application/json' },
          ...opts,
        });
      } catch (e) {
        const lost =
          'Assistant déconnecté. Relance T2K-Raid.bat et ne ferme pas la fenêtre noire (serveur local).';
        throw new Error(
          e && /failed to fetch|networkerror|load failed/i.test(String(e.message || e))
            ? lost
            : lost + ' (' + (e.message || e) + ')'
        );
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Erreur serveur');
      return data;
    }

    async function loadCfg() {
      state.cfg = await api('/api/config');
      return state.cfg;
    }

    function setMsg(html, ok) {
      const m = $('#msg');
      if (!m) return;
      m.className = 'msg ' + (ok ? 'ok' : 'err');
      m.textContent = html;
    }

    function render() {
      const view = $('#view');
      view.className = 'card ' + themeForStep(state.step);
      renderProgress();
      if (state.mode === 'raid') {
        view.innerHTML = raidHTML();
        bindRaid();
        return;
      }
      view.innerHTML = onboardHTML(state.step);
      bindOnboard(state.step);
    }

    function onboardHTML(step) {
      const pill = pillForStep(step);
      const head = `<div class="pill ${pill.cls}">${pill.text}</div>`;

      if (step === 0) {
        return head + `
          <h2>Bienvenue dans T2K</h2>
          <p class="lead">
            T2K permet d’envoyer ton chat <strong style="color:var(--twitch)">Twitch</strong>
            vers <strong style="color:var(--kick)">Kick</strong> (ou une autre URL https)
            avec une commande signée — personne ne peut falsifier ton raid.
          </p>
          <div class="split">
            <div class="tile tile-twitch">
              <h3>Sur Twitch</h3>
              <p>Tu colles une commande dans ton chat. Seule ta clé secrète peut la créer.</p>
            </div>
            <div class="tile tile-kick">
              <h3>Vers Kick</h3>
              <p>Les viewers avec l’extension voient une bannière 3 s, puis partent vers Kick.</p>
            </div>
          </div>
          <p class="hint">Ce guide dure ~5 minutes. Tu pourras le relancer via le bouton « Guide ».</p>
          <div class="actions">
            <button type="button" class="btn-bridge" id="next">Commencer</button>
            <button type="button" class="btn-ghost" id="skip">J’ai déjà configuré → Raid</button>
          </div>`;
      }

      if (step === 1) {
        return head + `
          <h2>Deux rôles</h2>
          <p class="lead">Tout le monde n’a pas la même chose à installer.</p>
          <div class="split">
            <div class="tile tile-twitch">
              <h3>Toi (streamer)</h3>
              <p>Cet assistant + clé privée + publication de ta clé publique + coller la commande sur Twitch.</p>
            </div>
            <div class="tile tile-kick">
              <h3>Tes viewers</h3>
              <p>Ils installent seulement l’extension Chrome T2K. Pas de Node, pas de clés.</p>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn-ghost" id="back">Retour</button>
            <button type="button" class="btn-twitch" id="next">Continuer</button>
          </div>`;
      }

      if (step === 2) {
        return head + `
          <h2>Ton identité Twitch</h2>
          <p class="lead">Utilise le login de ton URL : <span style="color:var(--twitch)">twitch.tv/<strong>tonpseudo</strong></span> — toujours en minuscules.</p>
          <label for="streamer">Login Twitch</label>
          <input id="streamer" placeholder="monpseudo" value="${esc(state.cfg.streamer || '')}" />
          <p class="hint">Ce login doit matcher exactement la page où tu postes la commande.</p>
          <div class="actions">
            <button type="button" class="btn-ghost" id="back">Retour</button>
            <button type="button" class="btn-twitch" id="next">Continuer</button>
          </div>
          <div class="msg" id="msg"></div>`;
      }

      if (step === 3) {
        return head + `
          <h2>Mot-clé dans le chat</h2>
          <p class="lead">Par défaut <code>!raid</code>. Tu peux choisir autre chose (sans espace). Les viewers détectent <em>ton</em> mot-clé via streamers.json.</p>
          <label for="trigger">Trigger</label>
          <input id="trigger" placeholder="!raid" value="${esc(state.cfg.trigger || '!raid')}" />
          <p class="hint">Exemples : !raid · !go · !t2k</p>
          <div class="actions">
            <button type="button" class="btn-ghost" id="back">Retour</button>
            <button type="button" class="btn-twitch" id="next">Continuer</button>
          </div>
          <div class="msg" id="msg"></div>`;
      }

      if (step === 4) {
        const hasKey = false;
        return head + `
          <h2>Créer ta clé secrète</h2>
          <p class="lead">
            Analogie : la clé privée = ton tampon officiel.
            Elle reste sur <strong>ce PC</strong>. Ne l’envoie à personne.
          </p>
          <button type="button" class="btn-bridge" id="genKeys">Générer ma paire de clés</button>
          <pre class="code hidden" id="jwkBox"></pre>
          <p class="hint" id="keyHint">Si une clé existe déjà pour ce login, on ne l’écrase pas (sécurité).</p>
          <div class="actions">
            <button type="button" class="btn-ghost" id="back">Retour</button>
            <button type="button" class="btn-bridge" id="next">Continuer</button>
          </div>
          <div class="msg" id="msg"></div>`;
      }

      if (step === 5) {
        const trigger = state.cfg.trigger || '!raid';
        const streamer = state.cfg.streamer || 'monpseudo';
        const block = state.publicKeyJson || `{
  "${streamer}": {
    "displayName": "${streamer}",
    "trigger": "${trigger}",
    "publicKey": { "kty": "EC", "crv": "P-384", "x": "…", "y": "…" }
  }
}`;
        return head + `
          <h2>Publier ta clé (vers Kick & viewers)</h2>
          <p class="lead">
            Colle ce bloc dans <code>public/streamers.json</code>, pousse sur GitHub,
            puis l’extension téléchargera ta clé depuis Pages.
          </p>
          <pre class="code" id="pubBlock">${esc(block)}</pre>
          <div class="actions">
            <button type="button" class="btn-kick" id="copyJson">Copier le JSON</button>
            <a class="btn-ghost" style="text-decoration:none;display:inline-flex;align-items:center;"
               href="https://t12lve.github.io/T2K/" target="_blank" rel="noopener">Ouvrir le tutoriel</a>
          </div>
          <p class="hint">URL publique attendue : https://t12lve.github.io/T2K/streamers.json</p>
          <div class="actions">
            <button type="button" class="btn-ghost" id="back">Retour</button>
            <button type="button" class="btn-kick" id="next">C’est publié / plus tard</button>
          </div>
          <div class="msg" id="msg"></div>`;
      }

      if (step === 6) {
        return head + `
          <h2>Extension Chrome (viewers + toi)</h2>
          <p class="lead">Sans l’extension, personne ne réagit au message signé.</p>
          <ul class="checklist">
            <li><span class="dot" style="background:var(--twitch)"></span><span>Ouvre <code>chrome://extensions</code></span></li>
            <li><span class="dot" style="background:var(--twitch)"></span><span>Active le <strong>Mode développeur</strong></span></li>
            <li><span class="dot" style="background:var(--kick)"></span><span>Charger l’extension non empaquetée → dossier <code>extension/</code> du projet T2K</span></li>
            <li><span class="dot" style="background:var(--kick)"></span><span>Tu dois voir l’extension nommée <strong>T2K</strong></span></li>
          </ul>
          <div class="actions">
            <button type="button" class="btn-ghost" id="back">Retour</button>
            <button type="button" class="btn-bridge" id="next">Extension OK</button>
          </div>`;
      }

      if (step === 7) {
        return head + `
          <h2>Premier raid</h2>
          <p class="lead">Choisis l’URL <strong style="color:var(--kick)">Kick</strong> (https), on signe, tu colles sur <strong style="color:var(--twitch)">Twitch</strong>.</p>
          <label for="url">URL cible</label>
          <input class="kick-focus" id="url" value="${esc(state.cfg.lastUrl || 'https://kick.com/')}" placeholder="https://kick.com/tonpseudo" />
          <div class="row">
            <div>
              <label for="ttl">Durée du token (sec)</label>
              <input id="ttl" type="number" min="1" max="180" value="${esc(String(state.cfg.ttl || 60))}" />
            </div>
            <div>
              <label>Trigger</label>
              <input value="${esc(state.cfg.trigger || '!raid')}" disabled />
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn-kick" id="sign">Signer &amp; copier</button>
          </div>
          <pre class="code hidden" id="cmdOut"></pre>
          <div class="actions">
            <button type="button" class="btn-ghost" id="back">Retour</button>
            <button type="button" class="btn-twitch" id="next">Terminer le guide</button>
          </div>
          <div class="msg" id="msg"></div>`;
      }

      if (step === 8) {
        return head + `
          <h2>Tu es prêt</h2>
          <p class="lead">
            Prochains raids : cet assistant s’ouvrira directement sur l’écran
            <strong style="color:var(--kick)">Raid</strong>. Le bouton <em>Guide</em> rejoue l’onboarding.
          </p>
          <ul class="checklist">
            <li><span class="dot" style="background:var(--twitch)"></span><span>Colle la commande sur ta chaîne Twitch</span></li>
            <li><span class="dot" style="background:var(--kick)"></span><span>Les viewers voient la bannière → Kick (ou Échap pour annuler)</span></li>
          </ul>
          <div class="actions">
            <button type="button" class="btn-kick" id="finish">Aller à l’écran Raid</button>
          </div>`;
      }

      return '';
    }

    function raidHTML() {
      const pill = pillForStep(0);
      return `
        <div class="pill ${pill.cls}">${pill.text}</div>
        <h2>Lancer un raid</h2>
        <p class="lead">Signe une commande pour <strong style="color:var(--twitch)">Twitch</strong>, destination <strong style="color:var(--kick)">Kick</strong>.</p>
        <label for="streamer">Login Twitch</label>
        <input id="streamer" value="${esc(state.cfg.streamer || '')}" />
        <div class="row">
          <div>
            <label for="trigger">Trigger</label>
            <input id="trigger" value="${esc(state.cfg.trigger || '!raid')}" />
          </div>
          <div>
            <label for="ttl">TTL (sec)</label>
            <input id="ttl" type="number" min="1" max="180" value="${esc(String(state.cfg.ttl || 60))}" />
          </div>
        </div>
        <label for="url">URL Kick (https)</label>
        <input class="kick-focus" id="url" value="${esc(state.cfg.lastUrl || 'https://kick.com/')}" />
        <div class="actions">
          <button type="button" class="btn-kick" id="sign">Signer &amp; copier</button>
        </div>
        <pre class="code hidden" id="cmdOut"></pre>
        <p class="hint">Pense à aligner le trigger avec <code>streamers.json</code> après un changement.</p>
        <div class="msg" id="msg"></div>`;
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/"/g, '&quot;');
    }

    function bindOnboard(step) {
      const back = $('#back');
      const next = $('#next');
      const skip = $('#skip');
      if (back) back.onclick = () => { state.step = Math.max(0, step - 1); render(); };
      if (skip) skip.onclick = async () => {
        state.mode = 'raid';
        await loadCfg();
        render();
      };
      if (next) next.onclick = () => onNext(step);

      if (step === 4) {
        const gen = $('#genKeys');
        if (gen) gen.onclick = onGenKeys;
        checkKeyStatus();
      }
      if (step === 5) {
        const c = $('#copyJson');
        if (c) c.onclick = async () => {
          try {
            await navigator.clipboard.writeText($('#pubBlock').textContent);
            setMsg('JSON copié.', true);
          } catch {
            setMsg('Copie manuelle nécessaire.', false);
          }
        };
      }
      if (step === 7) {
        const s = $('#sign');
        if (s) s.onclick = () => onSign(true);
      }
      if (step === 8) {
        const f = $('#finish');
        if (f) f.onclick = onFinish;
      }
    }

    function bindRaid() {
      const s = $('#sign');
      if (s) s.onclick = () => onSign(false);
    }

    async function onNext(step) {
      try {
        if (step === 2) {
          const streamer = $('#streamer').value.trim().toLowerCase();
          if (!/^[a-z0-9_]{1,25}$/.test(streamer)) {
            setMsg('Login invalide (a-z, 0-9, _, max 25).', false);
            return;
          }
          state.cfg = await api('/api/config', {
            method: 'POST',
            body: JSON.stringify({ ...state.cfg, streamer }),
          });
        }
        if (step === 3) {
          const trigger = $('#trigger').value.trim();
          state.cfg = await api('/api/config', {
            method: 'POST',
            body: JSON.stringify({ ...state.cfg, trigger }),
          });
        }
        if (step === 0 || step === 1 || step === 4 || step === 5 || step === 6) {
          /* no-op save */
        }
        if (step === 7) {
          /* allow finish without signing */
        }
        state.step = Math.min(TOTAL_ONBOARD - 1, step + 1);
        render();
      } catch (e) {
        setMsg(e.message, false);
      }
    }

    async function checkKeyStatus() {
      try {
        const st = await api('/api/key-status?streamer=' + encodeURIComponent(state.cfg.streamer || ''));
        if (st.exists) {
          $('#keyHint').textContent = 'Une clé existe déjà pour ' + state.cfg.streamer + ' — tu peux continuer.';
        }
      } catch (_) {}
    }

    async function onGenKeys() {
      setMsg('', true);
      try {
        const data = await api('/api/generate-keys', {
          method: 'POST',
          body: JSON.stringify({ streamer: state.cfg.streamer }),
        });
        const trigger = state.cfg.trigger || '!raid';
        const entry = {
          [data.streamer]: {
            displayName: data.streamer,
            trigger,
            publicKey: data.publicKey,
          },
        };
        state.publicKeyJson = JSON.stringify(entry, null, 2);
        const box = $('#jwkBox');
        box.textContent = state.publicKeyJson;
        box.classList.remove('hidden');
        setMsg('Clés créées. La privée est dans cli/keys/ (ne pas partager).', true);
      } catch (e) {
        setMsg(e.message, false);
      }
    }

    async function onSign(fromOnboard) {
      setMsg('', true);
      try {
        const body = {
          streamer: ($('#streamer') && $('#streamer').value) || state.cfg.streamer,
          trigger: ($('#trigger') && !$('#trigger').disabled && $('#trigger').value) || state.cfg.trigger,
          ttl: Number(($('#ttl') && $('#ttl').value) || state.cfg.ttl || 60),
          url: $('#url').value.trim(),
        };
        const data = await api('/api/sign', {
          method: 'POST',
          body: JSON.stringify(body),
        });
        state.cfg = await loadCfg();
        state.lastCommand = data.command;
        const out = $('#cmdOut');
        if (out) {
          out.textContent = data.command;
          out.classList.remove('hidden');
        }
        try {
          await navigator.clipboard.writeText(data.command);
          setMsg('Copié ! Colle (Ctrl+V) dans le chat Twitch.', true);
        } catch {
          setMsg('Signé — copie la commande affichée.', true);
        }
      } catch (e) {
        setMsg(e.message, false);
      }
    }

    async function onFinish() {
      await api('/api/config', {
        method: 'POST',
        body: JSON.stringify({ ...state.cfg, onboardingComplete: true }),
      });
      state.cfg = await loadCfg();
      state.mode = 'raid';
      render();
    }

    $('#btnReplay').onclick = async () => {
      state.mode = 'onboard';
      state.step = 0;
      await api('/api/config', {
        method: 'POST',
        body: JSON.stringify({ ...state.cfg, onboardingComplete: false }),
      });
      state.cfg = await loadCfg();
      render();
    };

    (async function init() {
      await loadCfg();
      if (state.cfg.onboardingComplete) {
        state.mode = 'raid';
      } else {
        state.mode = 'onboard';
        state.step = 0;
      }
      render();
    })();
  </script>
</body>
</html>
